name: docker

on:
  workflow_call:
    inputs:
      push:
        description: Push or not image to registry
        required: true
        type: boolean
      tag:
        description: Docker image tag
        required: true
        type: string
      latest:
        description: Add latest tag to docker image
        required: false
        type: boolean
        default: false


defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.NEON_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEON_DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: neondatabase/azure-blob-proxy:${{ inputs.tag }}

      - name: Add latest tag to image
        if: inputs.latest
        run: docker buildx imagetools create -t neondatabase/azure-blob-proxy:latest neondatabase/azure-blob-proxy:${{ inputs.tag }}
